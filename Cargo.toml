[workspace]
resolver = "2"
members = ["crates/rustsolve", "crates/rustsolve-capi", "crates/rustsolve-py", "bench/faerbench"]
default-members = ["crates/rustsolve", "crates/rustsolve-capi", "crates/rustsolve-py", "bench/faerbench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hang Chen <hchen117@uiowa.edu>"]
repository = "https://github.com/geohang/rustsolve"
# faer 0.24 needs 1.84; developed and measured with 1.99.0 (x86_64-pc-windows-gnu)
rust-version = "1.84"

[workspace.dependencies]
# Exact pins: a numerical kernel changes only on purpose (update the lock and
# rerun bench/ against the reference before changing these).
faer = { version = "=0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
feral-metis = "=0.3.0"
rayon = "=1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
